# Fly.io deployment for the Terrace MCP server.
#
# One small always-on machine serving the connector over HTTPS. Deploy from the
# repository root so the Dockerfile's build context includes the bundled data:
#
#   fly deploy -a <app-name> --config mcp_server/fly.toml --dockerfile mcp_server/Dockerfile
#
# Set the API-key secret first, never commit it:
#
#   fly secrets set TERRACE_API_KEY=<a long random string> -a <app-name>
#
# Then register https://<app-name>.fly.dev/mcp as a custom connector in Claude,
# with a request header Authorization = Bearer <the same key>.

app = "terrace-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so the connector never hits a cold start. The load
  # is a single personal user, so one small machine is plenty.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
