- id: goal_difference
  label: Goal difference
  grain: club_season
  unit: count
  kind: constructed          # goals_for minus goals_against
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/goal_difference.md
  higher_is_better: true
  precision: 0

- id: matches_played
  label: Matches played
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/matches_played.md
  higher_is_better: null
  precision: 0

# ---------------------------------------------------------------------------
# Optional menu. Uncomment the ones you want. Each needs a mart column and a
# definition doc added (I will wire those when you pick). All are constructed
# and computable from the columns we already have, so they are cheap to add.
# ---------------------------------------------------------------------------

