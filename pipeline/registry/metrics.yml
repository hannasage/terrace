# metrics.yml
#
# Every number the tools can return is declared here once. The MCP tools read
# this file, so a metric exists to the agent because it is listed here, never
# because a tool names it. Adding a metric is a registry entry plus a mart column
# plus a test, and nothing else.
#
# kind is observed or constructed. observed means a direct count or sum of values
# a source publishes (goals in a match, a match outcome). constructed means a
# value derived by a rule, which must be labelled as constructed everywhere it
# appears and carry a definition link. The observed / constructed calls below are
# a proposal; adjust them to taste before approving.
#
# grain club_season is one row per club per season. available_from is the
# earliest season every input exists; results run from 1992/93, so all of these
# start there. higher_is_better is null for a genuinely neutral metric.

# ---------------------------------------------------------------------------
# Active. These cover every column of mart__club_season.
# ---------------------------------------------------------------------------

- id: points
  label: Points
  grain: club_season
  unit: count
  kind: constructed          # 3 for a win, 1 for a draw: a competition rule
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/points.md
  higher_is_better: true
  precision: 0

- id: wins
  label: Wins
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/wins.md
  higher_is_better: true
  precision: 0

- id: draws
  label: Draws
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/draws.md
  higher_is_better: null
  precision: 0

- id: losses
  label: Losses
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/losses.md
  higher_is_better: false
  precision: 0

- id: goals_for
  label: Goals for
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/goals_for.md
  higher_is_better: true
  precision: 0

- id: goals_against
  label: Goals against
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/goals_against.md
  higher_is_better: false
  precision: 0

- id: goal_difference
  label: Goal difference
  grain: club_season
  unit: count
  kind: constructed          # goals_for minus goals_against
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/goal_difference.md
  higher_is_better: true
  precision: 0

- id: matches_played
  label: Matches played
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/matches_played.md
  higher_is_better: null
  precision: 0

# ---------------------------------------------------------------------------
# Derived metrics, activated from the optional menu.
# ---------------------------------------------------------------------------

- id: points_per_game
  label: Points per game
  grain: club_season
  unit: per_match
  kind: constructed          # points / matches_played
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/points_per_game.md
  higher_is_better: true
  precision: 2

- id: win_rate
  label: Win rate
  grain: club_season
  unit: ratio
  kind: constructed          # wins / matches_played
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/win_rate.md
  higher_is_better: true
  precision: 3

- id: league_position
  label: League position
  grain: club_season
  unit: count
  kind: constructed          # rank within the season on points, then GD, then GF
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/league_position.md
  higher_is_better: false    # 1 is champions
  precision: 0

