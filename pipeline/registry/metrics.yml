  higher_is_better: false
  precision: 2

- id: goal_difference_per_game
  label: Goal difference per game
  grain: club_season
  unit: per_match
  kind: constructed          # goal_difference / matches_played
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/goal_difference_per_game.md
