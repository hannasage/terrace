  higher_is_better: null
  precision: 0

- id: losses
  label: Losses
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/losses.md
  higher_is_better: false
  precision: 0

- id: goals_for
  label: Goals for
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
  definition_url: docs/metrics/goals_for.md
  higher_is_better: true
  precision: 0

- id: goals_against
  label: Goals against
  grain: club_season
  unit: count
  kind: observed
  available_from: "1992-93"
  sources: [engsoccerdata, football-data]
