version: 2

models:
  - name: mart__club_season
    description: >
      Premier League club-season standings quantities. One row per club per
      season. Points use the three-for-a-win rule the Premier League has used
      since 1992. Grain uniqueness is checked by
      tests/assert_club_season_grain.sql.
    columns:
      - name: season_start_year
        tests:
          - not_null
      - name: club_id
        tests:
          - not_null
      - name: points
        tests:
          - not_null
      - name: matches_played
        tests:
          - not_null

  - name: mart__club_match
    description: >
      Premier League matches at club grain, one row per club per match, the layer
      between core__match and mart__club_season. Grain uniqueness is checked by
      tests/assert_club_match_grain.sql.
    columns:
      - name: season_start_year
        tests:
          - not_null
      - name: club_id
        tests:
          - not_null
      - name: match_id
        tests:
          - not_null
      - name: result
        tests:
          - not_null
          - accepted_values:
              values: ['W', 'D', 'L']
