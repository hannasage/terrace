version: 2

models:
  - name: core__match
    description: >
      Conformed matches, competition-agnostic, both clubs resolved to canonical
      ids. The not_null tests on the club ids are the fail-closed reconciliation
      gate: an unresolved source name lands NULL and fails the build.
    columns:
      - name: match_id
        tests:
          - not_null
          - unique
      - name: home_club_id
        tests:
          - not_null
      - name: away_club_id
        tests:
          - not_null
      - name: season_start_year
        tests:
          - not_null
      - name: match_date
        tests:
          - not_null
