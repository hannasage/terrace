name: ci

# Every job here is a spec commitment made executable. Each one becomes a
# required status check on main, which is what lets the data lane merge without
# a human: the gates are trusted because they are the same gates either lane
# has to pass.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  house-style:
    name: house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One canonical definition of the em-dash and banned-vocabulary rules,
      # shared with the Makefile through scripts/house_style.py so local and CI
      # agree. Stdlib only, so no environment setup is needed.
      - name: House style
        run: python3 scripts/house_style.py

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same constraints the local hook enforces, applied to the diff.
      # A local hook only protects sessions that run the hook. This protects
      # the branch.
      - name: Run guardrails over changed files
        run: python scripts/guardrails_ci.py "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen

      # dbt reads the registry as Parquet, so materialise it from the YAML first.
      - name: Materialise registry
        run: uv run python scripts/registry_to_parquet.py

      # dbt build runs models and tests together. The singular assertions in
      # pipeline/dbt/tests/ are part of this and fail the job.
      - name: dbt build
        run: uv run dbt build --project-dir pipeline/dbt --profiles-dir pipeline/dbt

      - name: Registry consistency
        run: uv run python scripts/check_registry.py

      - name: Publish artefacts
        run: uv run python scripts/publish.py --check

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm run lint
        working-directory: web

      - run: npm run build
        working-directory: web

      # Contrast is computed from the token values in the built output, never
      # eyeballed. 4.5:1 floor, 7.0:1 for body copy, both themes.
      - name: WCAG contrast audit
        run: npm run audit:contrast
        working-directory: web
