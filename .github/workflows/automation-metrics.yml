name: automation-metrics

# Records the D-008 numbers so the build-model experiment is measured rather
# than remembered. Commits directly to main: it writes only to docs/metrics/,
# which is not a CODEOWNERS path, and gating a metrics file behind review would
# be the exact overhead this project is testing whether it can remove.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_automation_metrics.py --repo "${{ github.repository }}"

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain docs/metrics/)" ]; then
            git config user.name "terrace-bot"
            git config user.email "bot@users.noreply.github.com"
            git add docs/metrics/
            git commit -m "chore: automation metrics $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No change."
          fi
