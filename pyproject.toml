[project]
name = "terrace"
version = "0.1.0"
description = "Personal Premier League analysis pipeline. Deterministic ingest, dbt transforms, and quality gates."
readme = "README.md"
requires-python = ">=3.12"

# Dependencies fixed by BOOTSTRAP.md Phase 3. Any addition beyond this set is a
# decision for Hanna, per CLAUDE.md "When to stop and ask".
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "polars>=1.0",
    "pytest>=8.0",
]

[project.scripts]
# The ingest package is invoked as `python -m pipeline.ingest` by the Makefile
# and data-refresh.yml. No console script is declared, so the module entry
# point stays the single canonical path.

[tool.uv]
# uv manages the environment. `uv sync --frozen` in CI expects uv.lock to be
# committed, generated once with `uv sync` after this file lands.

[tool.pytest.ini_options]
testpaths = ["pipeline"]
python_files = ["test_*.py", "*_test.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
